<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Stylised golden wattle sprig">
  <title>Golden wattle sprig</title>
  <defs>
    <!-- halftone dot screen used to break the flat colour -->
    <pattern id="sprig-dots" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <circle cx="2.6" cy="2.6" r="1.7" fill="#463A6B" fill-opacity="0.5"/>
    </pattern>
    <pattern id="sprig-dots-warm" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <circle cx="3" cy="3" r="2" fill="#E9B44C" fill-opacity="0.55"/>
    </pattern>

    <linearGradient id="phyllode-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A4C88"/>
      <stop offset="100%" stop-color="#463A6B"/>
    </linearGradient>

    <!-- one bloom: a pom-pom of stamens -->
    <g id="bloom">
      <circle r="19" fill="#E9B44C"/>
      <circle cx="-24" cy="-14" r="13" fill="#E9B44C"/>
      <circle cx="24"  cy="-14" r="13" fill="#E9B44C"/>
      <circle cx="-24" cy="14"  r="12" fill="#E9B44C"/>
      <circle cx="24"  cy="14"  r="12" fill="#E9B44C"/>
      <circle cx="0"   cy="-27" r="11" fill="#E9B44C"/>
      <circle cx="0"   cy="27"  r="11" fill="#E9B44C"/>
      <circle cx="-14" cy="-26" r="8"  fill="#F3D08A"/>
      <circle cx="15"  cy="24"  r="8"  fill="#F3D08A"/>
      <circle r="34" fill="url(#sprig-dots)" fill-opacity="0.28"/>
      <circle cx="-6" cy="-5" r="6" fill="#C8912E" fill-opacity="0.7"/>
    </g>

    <!-- one phyllode: the flattened leaf-stalk of acacia -->
    <g id="phyllode">
      <path d="M0 0 C 40 -26, 108 -22, 146 0 C 108 22, 40 26, 0 0 Z" fill="url(#phyllode-fill)"/>
      <path d="M0 0 C 40 -26, 108 -22, 146 0 C 108 22, 40 26, 0 0 Z" fill="url(#sprig-dots-warm)" fill-opacity="0.35"/>
      <path d="M6 0 L 138 0" stroke="#E9B44C" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- main branch -->
  <g stroke="#463A6B" stroke-linecap="round" fill="none">
    <path d="M40 660 C 210 600, 300 470, 380 380 C 470 278, 620 208, 830 150" stroke-width="16"/>
    <path d="M300 470 C 330 400, 300 320, 250 250" stroke-width="10"/>
    <path d="M470 300 C 520 240, 520 160, 500 96" stroke-width="10"/>
    <path d="M600 226 C 660 210, 720 240, 762 292" stroke-width="9"/>
    <path d="M380 380 C 420 430, 470 470, 545 486" stroke-width="9"/>
    <path d="M690 182 C 730 132, 800 108, 862 108" stroke-width="8"/>
    <path d="M180 590 C 240 566, 300 578, 344 612" stroke-width="8"/>
  </g>

  <!-- phyllodes -->
  <g opacity="0.96">
    <use href="#phyllode" transform="translate(236 250) rotate(-118) scale(0.86)"/>
    <use href="#phyllode" transform="translate(300 470) rotate(-152) scale(0.78)"/>
    <use href="#phyllode" transform="translate(378 382) rotate(150) scale(0.92)"/>
    <use href="#phyllode" transform="translate(500 300) rotate(-64) scale(0.8)"/>
    <use href="#phyllode" transform="translate(548 486) rotate(28) scale(0.86)"/>
    <use href="#phyllode" transform="translate(612 224) rotate(-30) scale(0.74)"/>
    <use href="#phyllode" transform="translate(770 296) rotate(46) scale(0.8)"/>
    <use href="#phyllode" transform="translate(830 152) rotate(-8) scale(0.62)"/>
    <use href="#phyllode" transform="translate(150 604) rotate(168) scale(0.7)"/>
    <use href="#phyllode" transform="translate(346 614) rotate(24) scale(0.72)"/>
  </g>

  <!-- blooms -->
  <g>
    <use href="#bloom" transform="translate(250 250) scale(1.05)"/>
    <use href="#bloom" transform="translate(196 196) scale(0.72)"/>
    <use href="#bloom" transform="translate(500 96)  scale(1.15)"/>
    <use href="#bloom" transform="translate(560 132) scale(0.7)"/>
    <use href="#bloom" transform="translate(762 292) scale(1.0)"/>
    <use href="#bloom" transform="translate(700 330) scale(0.66)"/>
    <use href="#bloom" transform="translate(545 486) scale(1.08)"/>
    <use href="#bloom" transform="translate(614 520) scale(0.7)"/>
    <use href="#bloom" transform="translate(862 108) scale(0.9)"/>
    <use href="#bloom" transform="translate(344 612) scale(0.95)"/>
    <use href="#bloom" transform="translate(410 648) scale(0.62)"/>
    <use href="#bloom" transform="translate(120 578) scale(0.8)"/>
  </g>
</svg>
