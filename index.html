    <script>
      /* The remembered ground is applied before first paint so a visitor who
         chose Dusk never sees a frame of Night. Every read is guarded:
         blocked site data changes nothing but whether the choice survives. */
      (function () {
        var grounds = ["night", "earth", "ochre", "rose", "moss", "dusk", "wash"];
        try {
          var stored = window.localStorage.getItem("watl.ground.v2");
          if (grounds.indexOf(stored) !== -1) document.documentElement.dataset.ground = stored;
        } catch (error) {}
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.dataset.motion = "reduced";
        }
      })();
    </script>
